<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link id="pagestyle" rel="stylesheet" type="text/css" href="themes/theme1.css">
        
        <title> anyChat </title>
        
    </head>
    <script src="main.js" defer></script>
    <script src="/socket.io/socket.io.js"></script>
    <body>
        <header>
            <div>
                <button onclick="open_dialog(help_dialog)"> Help </button>
                <button onclick="open_dialog(theme_dialog)"> Themes </button>
            </div>
            
            
            <img src="assets/anychat.png" id="logo">
            
            <div>
                <input type="text" placeholder="Channel ID..." id="ch_input">
                <button onclick="read_msg(); setCh()"> Set </button> 
            </div>
        </header>
        <main id="chat_container">
            <!-- <div class="chat_group">
                <label><b> @cool16 $: </b></label>
                <p>So cool!</p>
            </div> -->
        </main>
        <footer>
            <div>
                <div id="cred_inputs">
                    <input id="pwd_input" type="password" placeholder="Password...">
                    <input id="usr_input" type="text" placeholder="Username (optional)">
                    <button onclick="setCred()"> Set </button>
                </div>
                <div id="msg_container">
                    <textarea id="msg_input" placeholder="Input text here..."></textarea>
                    <button id="send_btn" onclick="send_msg()">>> </button>
                </div>
            </div>
        </footer>
    </body>
    <dialog id="help_dialog">
        <h2> anyChat Help </h2>
        <hr>
        <h3> How it works: </h3>
        <ul>
            <li> Your sent message is encrypted using your password. </li>
            <li> Only the ones that has the same password in the password input can read your message. </li>
            <li> You can set a channel id to send a message in that channel. </li>
        </ul>
        <button onclick="close_dialog(help_dialog)"> Close </button>
    </dialog>
    
    <dialog id="theme_dialog">
        <h2> anyChat Themes </h2>
        <hr>
        <br>
        <span> >> <button onclick="switch_theme('themes/theme1.css')"> Default </button></span>
        <br>
        <span> >> <button onclick="switch_theme('themes/theme2.css')"> Blue </button></span>
        <br>
        <button onclick="close_dialog(theme_dialog)"> Close </button>
    </dialog>
</html>
